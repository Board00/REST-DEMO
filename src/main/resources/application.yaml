spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sniper_mastery?useSSL=false
    username: root
    password: "@boardKoni1234"
    driver-class-name: com.mysql.cj.jdbc.Driver

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
  #JPA Settings
  jpa.hibernate.ddl-auto: create




management:
  endpoints:
    web:
      exposure:
        include: "health, beans, metrics"
      base-path: "/"
  endpoint:
    health:
      show-details: always

koniService:
  port: 8081
  address: 127.0.0.1